<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Админка — Мелодия Гитар{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body{background:#0a0a0a;color:#f5f5f5;font-family:Inter,system-ui,sans-serif} input,textarea,select{background:#141414;border:1px solid #333;color:#fff;border-radius:6px;padding:.55rem .7rem;width:100%} textarea{min-height:110px} .btn{display:inline-flex;align-items:center;justify-content:center;border-radius:6px;padding:.55rem .8rem;font-size:.85rem;font-weight:600}.btn-red{background:#b91c1c}.btn-dark{background:#1b1b1b;border:1px solid #333}.table-wrap{overflow:auto;border:1px solid #2a2a2a;border-radius:8px}.danger{color:#fca5a5}</style>
</head>
<body>
<header class="border-b border-[#2a2a2a] bg-[#101010] sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
        <div>
            <div class="font-black tracking-wider text-red-500">МЕЛОДИЯ ГИТАР</div>
            <div class="text-[11px] text-gray-500">Панель администратора</div>
        </div>
        <div class="flex items-center gap-2">
            <a class="btn btn-dark" href="/" target="_blank">Открыть магазин</a>
            {% if request.session.get('is_admin') %}
            <form method="post" action="/admin/logout">
                <input type="hidden" name="token" value="{{ csrf_token }}">
                <button class="btn btn-dark" type="submit">Выйти</button>
            </form>
            {% endif %}
        </div>
    </div>
    {% if request.session.get('is_admin') %}
    <nav class="max-w-7xl mx-auto px-4 pb-3 flex flex-wrap gap-2 text-sm">
        <a class="btn btn-dark" href="/admin/products">Товары</a>
        <a class="btn btn-dark" href="/admin/categories">Категории</a>
        <a class="btn btn-dark" href="/admin/orders">Заказы</a>
    </nav>
    {% endif %}
</header>
<main class="max-w-7xl mx-auto p-4 md:p-6">
{% block content %}{% endblock %}
</main>
</body>
</html>
