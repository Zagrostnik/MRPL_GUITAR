services:
  - type: web
    name: melody-guitars
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: melody-guitars-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "true"
      - key: MAX_UPLOAD_MB
        value: "5"

databases:
  - name: melody-guitars-db
    plan: free
    databaseName: melody_guitars
    user: melody_guitars
